<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16314f" />
    <title>Sin conexión · Carmen María</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #16314f;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        padding: 16px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #fff;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      img { width: 72px; height: 72px; object-fit: contain; }
      h1 { color: #16314f; font-size: 20px; margin: 12px 0 6px; }
      p { color: #6b7280; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
      button {
        background: #265a93;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logocarmenmaria.png" alt="Carmen María" />
      <h1>Sin conexión</h1>
      <p>
        No hay internet en este momento. Revisa tu conexión y vuelve a
        intentarlo.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
